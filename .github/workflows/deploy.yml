# coralpetal.ai — review locally, then release to Production on Hostinger.
#
#   pull request into main → Site checks
#   push to main (merge)   → Site checks → WAIT FOR ROHIT'S APPROVAL → deploy → verify live commit
#
# Local review before any release:  scripts/preview.sh  →  http://localhost:8000
# Hosting: Hostinger Premium, SSH + rsync into ~/domains/coralpetal.ai/public_html.
# scripts/deploy_hostinger.sh refuses any other path (litandlatte.com shares this account).

name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HTML, links and accessibility basics
        run: python3 scripts/check_site.py site
      - name: Production build
        run: |
          bash scripts/build_env.sh prod /tmp/out-prod
          python3 scripts/check_site.py /tmp/out-prod
      - name: Deploy script syntax
        run: bash -n scripts/deploy_hostinger.sh

  deploy:
    name: Deploy · Production
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://coralpetal.ai
    env:
      SITE_URL: https://coralpetal.ai
      HOSTINGER_HOST: ${{ vars.HOSTINGER_HOST }}
      HOSTINGER_PORT: ${{ vars.HOSTINGER_PORT }}
      HOSTINGER_USER: ${{ vars.HOSTINGER_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash scripts/build_env.sh prod _site
      - name: SSH setup (pinned host keys)
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN: ${{ vars.HOSTINGER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Deploy to Hostinger
        run: bash scripts/deploy_hostinger.sh _site
      - name: Verify the live site serves this commit
        run: |
          want="${GITHUB_SHA:0:7}"
          for i in $(seq 1 18); do
            got=$(curl -s -m 10 -H 'Cache-Control: no-cache' "$SITE_URL/version.json?ci=$RANDOM" || true)
            echo "attempt $i: $got"
            echo "$got" | grep -q "\"commit\":\"$want\"" && echo "✅ $SITE_URL serves $want" && exit 0
            sleep 10
          done
          echo "::error::$SITE_URL did not serve commit $want within 3 minutes (DNS, SSL or CDN cache?)"
          exit 1
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id
