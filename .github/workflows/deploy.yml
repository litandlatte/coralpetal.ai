# Dev → UAT → Prod pipeline for coralpetal.ai, hosted on Hostinger (Premium plan, SSH + rsync)
#
#   push to dev  → checks → deploy Development  → https://dev.coralpetal.ai
#   push to uat  → checks → deploy UAT          → https://uat.coralpetal.ai
#   push to main → checks → WAIT FOR APPROVAL   → deploy Production → https://coralpetal.ai
#   pull request → checks only
#
# Server layout (hPanel subdomains nest inside the prod docroot):
#   ~/domains/coralpetal.ai/public_html        prod
#   ~/domains/coralpetal.ai/public_html/uat    uat
#   ~/domains/coralpetal.ai/public_html/dev    dev
# scripts/deploy_hostinger.sh refuses any other path (litandlatte.com shares this account).

name: Build & deploy

on:
  push:
    branches: [dev, uat, main]
  pull_request:
    branches: [dev, uat, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HTML, links and accessibility basics
        run: python3 scripts/check_site.py site
      - name: Build every environment (smoke test)
        run: |
          bash scripts/build_env.sh dev  /tmp/out-dev
          bash scripts/build_env.sh uat  /tmp/out-uat
          bash scripts/build_env.sh prod /tmp/out-prod
          python3 scripts/check_site.py /tmp/out-prod
      - name: Deploy-path guard self-test
        run: bash -n scripts/deploy_hostinger.sh

  deploy:
    name: Deploy · ${{ github.ref_name == 'main' && 'Production' || github.ref_name == 'uat' && 'UAT' || 'Development' }}
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'uat' && 'uat' || 'development' }}
      url: ${{ github.ref_name == 'main' && 'https://coralpetal.ai' || format('https://{0}.coralpetal.ai', github.ref_name) }}
    env:
      ENV_KEY: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
      SITE_URL: ${{ github.ref_name == 'main' && 'https://coralpetal.ai' || format('https://{0}.coralpetal.ai', github.ref_name) }}
      HOSTINGER_HOST: ${{ vars.HOSTINGER_HOST }}
      HOSTINGER_PORT: ${{ vars.HOSTINGER_PORT }}
      HOSTINGER_USER: ${{ vars.HOSTINGER_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash scripts/build_env.sh "$ENV_KEY" _site
      - name: SSH setup (pinned host keys)
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN: ${{ vars.HOSTINGER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Deploy to Hostinger
        run: bash scripts/deploy_hostinger.sh "$ENV_KEY" _site
      - name: Verify the live site serves this commit
        run: |
          want="${GITHUB_SHA:0:7}"
          for i in $(seq 1 18); do
            got=$(curl -s -m 10 -H 'Cache-Control: no-cache' "$SITE_URL/version.json?ci=$RANDOM" || true)
            echo "attempt $i: $got"
            echo "$got" | grep -q "\"commit\":\"$want\"" && echo "✅ $SITE_URL serves $want" && exit 0
            sleep 10
          done
          echo "::error::$SITE_URL did not serve commit $want within 3 minutes (DNS, SSL or CDN cache?)"
          exit 1
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id
