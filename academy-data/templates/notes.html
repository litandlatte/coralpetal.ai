{{> _head}}  <main id="main" class="notes-main">
    <section class="notes-page">
      <div class="wrap notes-bar">
        <p class="crumbs"><a href="/">Academy</a> / <a href="/{{section_slug}}/">{{section_name}}</a> / <a href="/{{section_slug}}/{{slug}}/">{{title}}</a> / Notes</p>
        <a class="res-btn" href="/{{section_slug}}/{{slug}}/">Back to the course</a>
      </div>
      <div class="notes-frame-wrap">
        <iframe class="notes-frame" src="{{embed_url}}" title="{{title}} notes" loading="lazy"></iframe>
      </div>
    </section>
  </main>

{{> _foot}}
